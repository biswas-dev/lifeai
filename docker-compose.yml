# One container: the Go binary serves the API, the photos and the built SPA.
# Host nginx terminates TLS and proxies to the loopback port.
services:
  lifeai:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VERSION=${VERSION:-dev}
        - GIT_COMMIT=${GIT_COMMIT:-unknown}
        - BUILD_TIME=${BUILD_TIME:-unknown}
    image: lifeai:${GIT_COMMIT:-dev}
    ports:
      - "127.0.0.1:${LIFEAI_PORT:-13440}:8080"
    volumes:
      - ./data:/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
